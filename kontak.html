<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kontak</title>

  <link rel="stylesheet"
  href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>

<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">

    <div class="container">

      <a class="navbar-brand" href="index.html">
        My Profile
      </a>

      <div class="collapse navbar-collapse">

        <ul class="navbar-nav ml-auto">

          <li class="nav-item">
            <a class="nav-link" href="praktikummodul7.html">
              Home

          <li class="nav-item">
            <a class="nav-link" href="makanan kesukaan.html">
              Makanan

          <li class="nav-item">
            <a class="nav-link" href="vidio kampus.html">
              Video

          <li class="nav-item active">
            <a class="nav-link" href="kontak.html">
              Kontak
            </a>
          </li>

        </ul>

      </div>

    </div>

  </nav>

  <section class="container mt-5">

    <h2 class="text-center text-primary mb-4">
      Form Kontak
    </h2>

    <form id="formKontak">

      <div class="form-group">

        <label>Nama</label>

        <input type="text"
        id="nama"
        class="form-control">

      </div>

      <div class="form-group">

        <label>Email</label>

        <input type="email"
        id="email"
        class="form-control">

      </div>

      <div class="form-group">

        <label>Pesan</label>

        <textarea
        id="pesan"
        class="form-control"
        rows="5"></textarea>

      </div>

      <button type="submit"
      class="btn btn-primary">
        Kirim
      </button>

    </form>

    <div id="hasil" class="mt-4"></div>

  </section>

  <script>

    document.getElementById("formKontak")
    .addEventListener("submit", function(event){

      event.preventDefault();

      let nama =
      document.getElementById("nama").value;

      let email =
      document.getElementById("email").value;

      let pesan =
      document.getElementById("pesan").value;

      document.getElementById("hasil").innerHTML = `

        <div class="card">
          <div class="card-body">

            <h4 class="text-primary">
              Hasil Input
            </h4>

            <p>
              <strong>Nama:</strong> ${nama}
            </p>

            <p>
              <strong>Email:</strong> ${email}
            </p>

            <p>
              <strong>Pesan:</strong> ${pesan}
            </p>

          </div>
        </div>

      `;

    });

  </script>

</body>
</html>
